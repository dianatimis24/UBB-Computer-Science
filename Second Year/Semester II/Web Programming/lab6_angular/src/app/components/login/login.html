<div class="login">
    <div class="login__card">
        <h2 class="login__title">Login</h2>
        <p class="login__subtitle">Hotel Booking System</p>

        @if (errorMessage()) {
        <p class="login__error">{{ errorMessage() }}</p>
        }

        <div class="form-group">
            <label class="form-group__label" for="username">Username</label>
            <input class="form-group__input" type="text" id="username" [ngModel]="username()"
                (ngModelChange)="username.set($event)" placeholder="Enter username" autocomplete="username" />
        </div>

        <div class="form-group">
            <label class="form-group__label" for="password">Password</label>
            <input class="form-group__input" type="password" id="password" [ngModel]="password()"
                (ngModelChange)="password.set($event)" placeholder="Enter password" autocomplete="current-password" />
        </div>

        <button class="button button--primary button--full" (click)="onLogin()">
            Login
        </button>
    </div>
</div>
